; *----------------------------------------------------------*
; *  HaloScale - resolution independent pickup halos        *
; *----------------------------------------------------------*
;
; The pickup halo wire sphere is drawn by the game as a line list, and D3D8
; rasterises lines exactly one pixel wide whatever the resolution. That is the
; right thickness on a 640x448 PS2 framebuffer, but at 1080p the wires end up
; far too thin - the dark blue weapon spheres almost disappear.
;
; This plugin redraws the wires as quads with a constant width in pixels.

[Main]

; 0 turns the plugin off completely and leaves the vanilla line list alone.
bEnabled=1

; Wire thickness is (screen height / nReferenceHeight) pixels.
; 448 is the PS2 framebuffer height, so 1080p gives roughly 2.4 pixel wires.
; Lower this number for thicker wires, raise it for thinner ones.
nReferenceHeight=448

; Extra multiplier applied on top, if you just want it chunkier or finer.
fWidthScale=1.0

; Hard ceiling on the wire width in pixels.
fMaxWidth=8.0

; Sphere alpha, 1-255. Leave at 0 to keep the game's own value of 120.
;
; Measured against a PS2 capture, the game's 120 is already correct - the PS2 puts
; the same amount of light on screen. The blue weapon spheres look faint because
; blue is only about 7% of perceived luminance under additive blending, not because
; the PC alpha is wrong. So leave this at 0 unless you specifically want the halos
; brighter than the PS2 ever was; raising it affects every halo colour.
;
; If the blue ones still read too weakly, prefer lowering nReferenceHeight instead.
; Thicker wires cover more whole pixels, which raises how bright the sphere reads
; without pushing any individual pixel past what the PS2 draws.
;
; Values above 255 would wrap and make the sphere vanish, so this is capped at 255.
nAlpha=0

; Diagnostic. 1 writes HaloScale.log next to this file, recording the render size
; the plugin saw, the wire width it computed, and every distinct halo colour it
; has drawn. The colour list grows as you meet new pickup classes and the file is
; rewritten each time, so play through an area and then read it. 0 writes nothing.
bLog=0

; ---------------------------------------------------------------------------
; Optional extras. Set both to off - bGlow=0 and fBlueAlphaScale=1.0 - and the
; plugin renders at PS2 parity, which is what the measurements were taken against.
; The shipped defaults deliberately go past that: bGlow for the soft falloff an
; upscaling emulator gives the PS2 picture, and the blue boost because blue reads
; weakly even on the original.
; ---------------------------------------------------------------------------

; Soft glow. Draws a second, wider, dimmer copy of each wire under the sharp one.
; Additive blending sums them, which reproduces the gentle falloff that an
; upscaling emulator gives the PS2 picture, instead of faking it with thickness.
; This is the option that makes the PC look closest to PS2 footage.
bGlow=1

; How much wider the glow pass is than the sharp wire. 3.0 = three times.
fGlowWidth=3.0

; Glow brightness as a fraction of the sharp wire. Keep it low or the core
; stops reading as a distinct line. White painkiller spheres clip first.
fGlowAlpha=0.33

; Extra alpha for blue weapon spheres only, leaving every other colour at PS2
; parity. Blue gets about 7% of perceived luminance under additive blending
; where yellow gets ~93%, so the same alpha reads far weaker on blue.
; 1.0 = no change. 1.5 is the shipped default: measured against a PS2 capture it
; puts blue about 27% brighter per pixel than the original, which reads clearly
; without looking artificial. Alpha lands at 180 of 255, so nothing clips.
; Detection needs blue above both red and green by 20 AND |r-g| under 20, so the
; cyan save tapes, the teal quest items and white painkillers are all excluded.
fBlueAlphaScale=1.5
